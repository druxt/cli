---
# CI for the Druxt CLI. See the Druxt repository standard for what each job is
# for.
#
# GitHub Actions (.github/workflows/ci.yml) runs the same lint and test set.
# Keep the two in step: nothing on the GitHub side lints that workflow, so
# lint:yaml here runs actionlint over it in return.
#
# Secret scanning is gitleaks, not GitLab's Security/Secret-Detection template.
# That template is an Ultimate-tier feature: on a non-Ultimate instance the
# include produces no job at all, so the configuration reads as coverage while
# scanning nothing.

stages:
  - lint
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  tags: [docker]
  timeout: 15m
  before_script:
    - 'section_start() { local n="$1" t="${2:-$1}"; printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)" "$n" "$t"; }'
    - 'section_end() { printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)" "$1"; }'

# Shared Node setup. `corepack prepare --activate` reads the packageManager
# field, so this block names no manager version. The cache is keyed by the
# lockfile hash: a dependency bump misses once and hits after that.
.node:
  image: node:24.18.0
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
      prefix: node-24.18.0
    paths:
      - .npm/
  before_script:
    - !reference [default, before_script]
    - corepack enable
    - corepack prepare --activate
    - npm ci --cache .npm --prefer-offline

#
# --- Lint ---
#

lint:js:
  extends: .node
  stage: lint
  script:
    - section_start "eslint" "Linting sources, tests and scripts"
    - npm run lint:js
    - section_end "eslint"
    - section_start "prettier" "Checking formatting"
    - npm run lint:format
    - section_end "prettier"
    - section_start "typecheck" "Type checking"
    - npm run typecheck
    - section_end "typecheck"

lint:md:
  extends: .node
  stage: lint
  script:
    - section_start "markdownlint" "Linting Markdown"
    - npm run lint:md
    - section_end "markdownlint"

lint:cspell:
  extends: .node
  stage: lint
  script:
    - section_start "cspell" "Spell checking"
    - npm run lint:cspell
    - section_end "cspell"

# This repository is public, and the registry it carries is read by every copy
# of the CLI. A host only the author can reach must never reach a tracked file.
lint:private:
  extends: .node
  stage: lint
  script:
    - section_start "private-refs" "Checking for private host references"
    - npm run lint:private
    - section_end "private-refs"

lint:knip:
  extends: .node
  stage: lint
  script:
    - section_start "knip" "Checking for unused and undeclared dependencies"
    - npm run lint:knip
    - section_end "knip"

# Production only. A shipped runtime dependency is what reaches a user. A
# devDependency advisory is worth knowing about and not worth blocking on.
lint:audit:
  extends: .node
  stage: lint
  script:
    - section_start "audit" "Auditing shipped dependencies"
    - npm run lint:audit
    - section_end "audit"

# yamllint covers this file. actionlint covers the GitHub workflow, which
# nothing on the GitHub side lints before a push.
lint:yaml:
  stage: lint
  image: python:3.12-slim
  interruptible: true
  variables:
    ACTIONLINT_VERSION: '1.7.12'
    ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  script:
    - section_start "yamllint" "Linting YAML"
    - pip install --quiet yamllint
    - yamllint .gitlab-ci.yml .github/workflows/
    - section_end "yamllint"
    - section_start "actionlint" "Linting GitHub workflows"
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - curl -sSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
    - echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
    - tar -xzf actionlint.tar.gz actionlint
    - ./actionlint -color
    - section_end "actionlint"

# The merge request's own commits, not the whole history. This repository
# squash-merges, so a prose title becomes the commit subject and breaks the
# next push to the target branch.
lint:commit:
  extends: .node
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - section_start "commitlint" "Validating commit messages"
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth 50
    - npm run lint:commit -- --from "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --to HEAD --verbose
    - section_end "commitlint"

# The work is the author's. No commit, merge request description or tracked
# file may credit an AI tool as author, co-author or generator. Full history,
# because the range is the merge request's own and its base has to be present.
lint:attribution:
  image: node:24.18.0
  stage: lint
  interruptible: true
  variables:
    GIT_DEPTH: 0
  script:
    - section_start "attribution" "Checking for AI attribution"
    - bash .gitlab/scripts/check-attribution.sh
    - section_end "attribution"

# Project voice over the markdown a change touches, its commit messages and the
# merge request description. The changesets README is third-party text.
lint:prose:
  image: node:24.18.0
  stage: lint
  interruptible: true
  variables:
    GIT_DEPTH: 0
    PROSE_LINT_GLOB: "!.changeset/README.md"
  cache:
    key: vale-3.17.1
    paths:
      - .vale/
  script:
    - section_start "prose" "Linting prose with Vale"
    - bash .gitlab/scripts/install-vale.sh .vale/bin .vale/styles
    - bash .gitlab/scripts/lint-prose.sh
    - section_end "prose"

#
# --- Test ---
#

# No network: the tests serve their own registry and tarball from a loopback
# port. The coverage floor in vitest.config.ts is what fails this job when
# coverage drops.
test:unit:
  extends: .node
  stage: test
  needs: []
  script:
    - section_start "vitest" "Running unit tests"
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit/junit.xml
    - section_end "vitest"
  artifacts:
    when: always
    reports:
      junit: reports/junit/junit.xml
    paths:
      - coverage/
    expire_in: 1 week
  # Puts the coverage percentage in the merge request widget.
  coverage: '/All files\s*\|\s*([\d.]+)/'

# A published install reads each package's files allowlist and links its
# binaries. The unit tests read the sources and do neither, so this is the job
# that proves the packages a user downloads can be installed and run.
test:pack:
  extends: .node
  stage: test
  needs: []
  script:
    - section_start "build" "Building both packages"
    - npm run build
    - section_end "build"
    - section_start "pack" "Packing and installing the tarballs"
    - mkdir -p "$CI_PROJECT_DIR/pack-check"
    - npm pack --workspaces --pack-destination "$CI_PROJECT_DIR/pack-check"
    - cd "$CI_PROJECT_DIR/pack-check" && npm init -y > /dev/null
    - npm install ./druxt-cli-*.tgz ./create-druxt-*.tgz --no-audit --no-fund
    - test "$(./node_modules/.bin/drx --version)" = "$(node -p "require('$CI_PROJECT_DIR/packages/cli/package.json').version")"
    - test -f node_modules/@druxt/cli/starters/index.json
    - ./node_modules/.bin/drx info
    - ./node_modules/.bin/create-druxt --help
    # The unattended path, as a pipeline runs it: no prompt, defaults applied.
    - ./node_modules/.bin/drx init pack-site --yes --no-interactive --json
    - test -f pack-site/drx.config.json
    - section_end "pack"

# The one job that needs the network: it creates a site from the real
# quickstart tarball the registry entry points at, and reads it back.
test:e2e:
  extends: .node
  stage: test
  needs: []
  script:
    - section_start "e2e" "Creating a site from the real starter"
    - npm run test:e2e
    - section_end "e2e"

#
# --- Secret detection ---
#

secret-detection:
  stage: lint
  image: alpine:3.21
  interruptible: true
  dependencies: []
  variables:
    GITLEAKS_VERSION: '8.30.1'
    GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  script:
    - section_start "gitleaks" "Scanning for committed secrets"
    - apk add --no-cache curl tar git > /dev/null
    - curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
    - echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
    - tar -xzf gitleaks.tar.gz gitleaks
    - ./gitleaks detect --source . --no-banner --redact --verbose
    - section_end "gitleaks"
    # A scan that finds nothing looks identical to a scan that cannot find
    # anything. Plant three credentials outside the repository and assert all
    # three are reported, so a bad download, a config change or a widened
    # allowlist fails the job.
    #
    # Each value is split across its own prefix so no fragment in this file
    # triggers the rule it is meant to exercise: the repository scan above runs
    # over this file too, and a canary that flags itself would need an ignore
    # entry, which is the thing being guarded against.
    #
    # Fixed values, not generated ones. Detection is keyword-driven, not
    # entropy-driven, so a generated credential fires only sometimes. A value
    # verified once keeps firing.
    #
    # Invented, not copied from any vendor's documentation: gitleaks allowlists
    # documentation keys, and a canary built from one would never fire.
    - section_start "canary" "Checking that the scanner still detects"
    - |
      canary="$(mktemp -d)"
      pat="gh""p_8fK2mQ7xR4tV9nB3jH6yW1sZ5cD8gL0aE4uY"
      stripe="sk""_live_51aBcD2eFgH3iJkL4mNoP5qR6sTuV7wXyZ8a"
      slack="xo""xb-263594753641-2529420432-J1n4h6a9pQrStUvWxYz1AbCd"
      printf 'a = "%s"\nb = "%s"\nc = "%s"\n' "$pat" "$stripe" "$slack" > "$canary/canary.txt"
      ./gitleaks detect --no-git --source "$canary" --no-banner --redact \
        --report-format json --report-path "$canary/report.json" || true
      found=$(grep -c '"RuleID"' "$canary/report.json" || true)
      rm -rf "$canary"
      if [ "$found" != "3" ]; then
        echo "The canary planted 3 credentials and gitleaks reported $found."
        echo "The scan above proves nothing while this is true."
        exit 1
      fi
      echo "Canary detected 3 of 3 planted credentials."
    - section_end "canary"
